# 持续集成：安装依赖 → ESLint → 类型检查 → 单元测试
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 同一分支的新提交会取消仍在运行的旧任务，节省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 使用 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 仓库尚未提交 pnpm-lock.yaml，故不使用 --frozen-lockfile
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: ESLint 检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试（Vitest）
        run: pnpm test
